components:
  schemas:
    ChildId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Nickname:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '\S'
      description: >-
        Nickname only. The server trims leading and trailing whitespace and
        collapses internal whitespace runs to one space (decision D4), then
        rejects an empty result; whitespace-only values are invalid. Unicode
        control and format characters (for example a zero-width space) are also
        rejected. The `pattern` checks only for a non-space character; the
        server enforces the character rule.
    BirthMonthYear:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      description: >-
        Coarse YYYY-MM, never an exact date. An ISO 8601 reduced-precision
        calendar month, not an RFC 3339 full-date or date-time (RFC 3339
        section 5.6 full-date needs year-month-day). The pattern checks shape
        only; the 422 range check is server logic. Age in months is computed against
        the server's UTC calendar month. A future month or an age over 71
        months is rejected with 422 UNPROCESSABLE_ENTITY (shape errors are 400).
    AgeBand:
      type: string
      enum: [0-5m, 6-11m, 12-23m, 24-35m, 36-47m, 48-59m, 60-71m]
      description: Navigation categories, not clinical classifications.
    CreateChild:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          $ref: '#/components/schemas/Nickname'
        birthMonthYear:
          $ref: '#/components/schemas/BirthMonthYear'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
      oneOf:
        - required: [birthMonthYear]
        - required: [ageBand]
      description: >-
        Exactly one age source. When birthMonthYear is given, the server derives
        ageBand. Otherwise the caregiver selects a band. No implicit defaults
        or null values.
    UpdateChild:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname:
          $ref: '#/components/schemas/Nickname'
        birthMonthYear:
          $ref: '#/components/schemas/BirthMonthYear'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
      not:
        required: [birthMonthYear, ageBand]
      description: >-
        At least one field; at most one of birthMonthYear and ageBand. Same
        validation as create. No nulls.
    ChildProfile:
      type: object
      additionalProperties: false
      required: [id, nickname, ageBand, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ChildId'
        nickname:
          $ref: '#/components/schemas/Nickname'
        birthMonthYear:
          $ref: '#/components/schemas/BirthMonthYear'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: >-
        Public projection; caregiverId is internal. Optional birth month
        is omitted when not supplied. No nulls or implicit defaults. UTC timestamps
        are serialized from internal Firestore timestamps. When birthMonthYear is
        present, ageBand is derived on read from the UTC calendar month; a child
        past 71 months stays at 60-71m (conservative; no new field, never
        rejected on read). A caregiver-selected band is returned as stored.
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [ageBand, timeMinutes, language]
      properties:
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        domain:
          $ref: '#/components/schemas/Domain'
        setting:
          allOf:
            - $ref: '#/components/schemas/Setting'
          default: either
        timeMinutes:
          type: integer
          minimum: 5
          maximum: 120
        materials:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        language:
          $ref: '#/components/schemas/Language'
        count:
          type: integer
          minimum: 1
          maximum: 3
          default: 3
    RecommendationResponse:
      type: object
      required: [suggestions, source, tier, provenance]
      properties:
        suggestions:
          type: array
          maxItems: 3
          items:
            type: object
            required: [activityId, title, whyPicked, activity]
            properties:
              activityId:
                type: string
              title:
                type: string
              whyPicked:
                type: string
                maxLength: 140
              activity:
                $ref: '#/components/schemas/CatalogActivity'
        source:
          type: string
          enum: [ai, catalog_fallback]
        tier:
          type: integer
          enum: [1, 2, 3]
        provenance:
          type: object
          required: [badge, label, disclaimer, model, reviewed]
          properties:
            badge:
              type: [string, 'null']
              enum: [Suggested by AI, null]
            label:
              type: [string, 'null']
              enum: [Our picks, null]
            disclaimer:
              type: string
            guidance:
              type: string
              description: Present only when source is ai.
            model:
              type: [string, 'null']
            reviewed:
              type: boolean
              const: true
        reason:
          type: string
          enum: [NO_REVIEWED_CONTENT]
    StoryActivityRequest:
      type: object
      additionalProperties: false
      required: [ageBand]
      properties:
        bookTitle:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Alias for bookTitle
        subjects:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
            maxLength: 64
        ageBand:
          $ref: '#/components/schemas/AgeBand'
    StoryActivitySuggestion:
      type: object
      additionalProperties: false
      required: [title, domain, instructions, safetyNotice]
      properties:
        title:
          type: string
        domain:
          type: string
        instructions:
          type: string
        safetyNotice:
          type: string
    StoryActivityProvenance:
      type: object
      additionalProperties: false
      required: [tier, source, badge, disclaimer]
      properties:
        tier:
          type: integer
          enum: [1, 2, 3]
        source:
          type: string
        badge:
          type: [string, 'null']
          enum: [Suggested by AI, null]
        disclaimer:
          type: string
    StoryActivityResponse:
      type: object
      additionalProperties: false
      required: [bookTitle, suggestion, provenance]
      properties:
        bookTitle:
          type: string
        suggestion:
          $ref: '#/components/schemas/StoryActivitySuggestion'
        provenance:
          $ref: '#/components/schemas/StoryActivityProvenance'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field:
                    type: string
                  issue:
                    type: string
      description: Existing safe error envelope; never includes resource metadata or token details.
    ActivityType:
      type: string
      enum:
        - activity
        - story
        - rhyme
        - game

    Domain:
      type: string
      enum:
        - cognitive
        - motor
        - language
        - socioEmotional

    Language:
      type: string
      enum:
        - en
        - fil
        - hil

    Setting:
      type: string
      enum:
        - indoor
        - outdoor
        - either

    ReviewStatus:
      type: string
      enum:
        - reviewed_approved
        - synthetic_fixture
        - draft

    CatalogActivity:
      type: object
      required:
        - id
        - title
        - type
        - language
        - setting
        - ageBand
        - domain
        - durationMinutes
        - durationEstimate
        - materials
        - instructions
        - provenanceSource
        - status
        - limitations
      properties:
        id:
          type: string
          example: act-ph-bahay-bahayan-01
        title:
          type: string
          maxLength: 100
          example: Bahay-Bahayan Pretend Play
        type:
          $ref: '#/components/schemas/ActivityType'
        language:
          $ref: '#/components/schemas/Language'
        setting:
          $ref: '#/components/schemas/Setting'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        domain:
          $ref: '#/components/schemas/Domain'
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
          example: 15
        durationEstimate:
          type: string
          example: 10-15 mins
        materials:
          type: array
          items:
            type: string
          example: ["blanket", "cushions"]
        instructions:
          type: array
          items:
            type: string
          example:
            - Set up cushions or chairs to form walls.
            - Drape a light blanket to create a roof.
            - Encourage child to act out everyday household routines.
        provenanceSource:
          type: string
          example: Synthetic engineering fixture; no external source
        status:
          $ref: '#/components/schemas/ReviewStatus'
        limitations:
          type: string
          example: Provisional Academic Reference — Pending Review. Educational prompt only; not a diagnostic assessment.

    BookItem:
      type: object
      required:
        - id
        - title
        - authors
        - coverUrl
        - subjects
      properties:
        id:
          type: string
          example: OL52987W
        title:
          type: string
          example: The Very Hungry Caterpillar
        authors:
          type: array
          items:
            type: string
          example: ["Eric Carle"]
        coverUrl:
          type: [string, "null"]
          example: https://covers.openlibrary.org/b/id/7835968-M.jpg
        subjects:
          type: array
          items:
            type: string
          example: ["Caterpillars", "Metamorphosis", "Picture books"]

    BooksResponse:
      type: object
      required:
        - subject
        - totalCount
        - books
        - provenance
      properties:
        subject:
          type: string
          example: picture_books
        totalCount:
          type: integer
          example: 12
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookItem'
        provenance:
          type: object
          required:
            - source
          properties:
            source:
              type: string
              example: Open Library (Internet Archive)
            license:
              type: string
              example: "Open Library data; no new rights asserted by the Internet Archive (see https://openlibrary.org/developers/licensing); some contributions may carry existing rights"

    WeatherResponse:
      type: object
      additionalProperties: false
      required: [condition, rainChance, heatFlag, suggestedSetting, hint, provenance]
      properties:
        condition:
          type: string
          example: cloudy
        rainChance:
          type: integer
          minimum: 0
          maximum: 100
          example: 10
        heatFlag:
          type: boolean
          example: false
        suggestedSetting:
          $ref: '#/components/schemas/Setting'
        hint:
          type: [string, 'null']
          example: Good weather for outdoor play · Outdoor ideas
        provenance:
          $ref: '#/components/schemas/WeatherProvenance'

    WeatherProvenance:
      type: object
      additionalProperties: false
      required: [source, attribution, license]
      properties:
        source:
          type: string
          example: Open-Meteo
        attribution:
          type: string
          example: Weather data by Open-Meteo.com
        license:
          type: string
          example: CC BY 4.0

    PlanId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

    PlanStatus:
      type: string
      enum:
        - planned
        - completed
        - skipped
      description: Routine planning status.

    CreatePlan:
      type: object
      additionalProperties: false
      required:
        - activityId
        - scheduledDate
      properties:
        activityId:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9-]+$'
        scheduledDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        status:
          $ref: '#/components/schemas/PlanStatus'
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
        feedbackNote:
          type: string
          maxLength: 300

    UpdatePlan:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        activityId:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9-]+$'
        scheduledDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        status:
          $ref: '#/components/schemas/PlanStatus'
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
        feedbackNote:
          type: string
          maxLength: 300

    Plan:
      type: object
      additionalProperties: false
      required:
        - id
        - childId
        - activityId
        - scheduledDate
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/PlanId'
        childId:
          $ref: '#/components/schemas/ChildId'
        activityId:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9-]+$'
        scheduledDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        status:
          $ref: '#/components/schemas/PlanStatus'
        completedAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
        feedbackNote:
          type: string
          maxLength: 300
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MilestoneStatus:
      type: string
      enum:
        - observed
        - not_yet_observed
        - not_sure
      description: Non-diagnostic caregiver observation status.

    MilestoneId:
      type: string
      maxLength: 64
      pattern: '^[a-zA-Z0-9_-]+$'

    CreateMilestoneObservation:
      type: object
      additionalProperties: false
      required:
        - milestoneId
        - status
      properties:
        milestoneId:
          $ref: '#/components/schemas/MilestoneId'
        status:
          $ref: '#/components/schemas/MilestoneStatus'
        observedDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        notes:
          type: string
          maxLength: 500

    UpdateMilestoneObservation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/MilestoneStatus'
        observedDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        notes:
          type: string
          maxLength: 500

    CaregiverProfile:
      type: object
      additionalProperties: false
      required:
        - uid
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 60
        weatherLocation:
          type: object
          additionalProperties: false
          required: [name, latitude, longitude]
          properties:
            name:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JournalEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - childId
        - entryDate
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        childId:
          $ref: '#/components/schemas/ChildId'
        entryDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        content:
          type: string
          maxLength: 2000
        linkedMilestoneId:
          $ref: '#/components/schemas/MilestoneId'
        linkedActivityId:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9-]+$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountExport:
      type: object
      additionalProperties: false
      required:
        - exportedAt
        - profile
        - children
        - plans
        - observations
        - journalEntries
      properties:
        exportedAt:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/CaregiverProfile'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildProfile'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/MilestoneObservation'
        journalEntries:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'

    MilestoneObservation:
      type: object
      additionalProperties: false
      required:
        - id
        - childId
        - milestoneId
        - status
        - observedDate
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        childId:
          $ref: '#/components/schemas/ChildId'
        milestoneId:
          $ref: '#/components/schemas/MilestoneId'
        status:
          $ref: '#/components/schemas/MilestoneStatus'
        observedDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        notes:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WeeklySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - weekStartDate
        - weekEndDate
        - completedActivityCount
        - observedMilestoneCount
        - totalPlannedActivities
        - domainDistribution
        - topActivityIds
        - reflectionPrompt
        - generatedAt
      properties:
        id:
          type: string
          pattern: '^\d{4}-W(?:0[1-9]|[1-4]\d|5[0-3])$'
          example: '2026-W45'
        weekStartDate:
          type: string
          format: date
          example: '2026-11-02'
        weekEndDate:
          type: string
          format: date
          example: '2026-11-08'
        completedActivityCount:
          type: integer
          minimum: 0
          example: 3
        observedMilestoneCount:
          type: integer
          minimum: 0
          example: 2
        totalPlannedActivities:
          type: integer
          minimum: 0
          example: 4
        domainDistribution:
          $ref: '#/components/schemas/DomainDistribution'
        topActivityIds:
          type: array
          items:
            type: string
          example: ['act-synth-001', 'act-synth-002']
        reflectionPrompt:
          type: string
          example: 'You engaged in shared activities and noted emerging milestones this week. Continuing everyday playful interactions nurtures learning and connection.'
        generatedAt:
          type: string
          format: date-time
          example: '2026-11-06T12:00:00.000Z'
    DomainDistribution:
      type: object
      additionalProperties: false
      required:
        - cognitive
        - motor
        - language
        - socioEmotional
      properties:
        cognitive:
          type: integer
          minimum: 0
          example: 1
        motor:
          type: integer
          minimum: 0
          example: 2
        language:
          type: integer
          minimum: 0
          example: 1
        socioEmotional:
          type: integer
          minimum: 0
          example: 0

  examples:
    Child:
      summary: Synthetic profile; age shown as of October 2026.
      value:
        id: 6f1c344e-84a8-4e24-9d72-74739a8c1362
        nickname: Sample Child
        birthMonthYear: '2025-08'
        ageBand: 12-23m
        createdAt: '2026-10-29T08:00:00Z'
        updatedAt: '2026-10-29T08:00:00Z'
  responses:
    OwnedChild:
      description: Public projection of an owned child.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChildProfile'
          examples:
            owned:
              $ref: '#/components/examples/Child'
    Unauthenticated:
      description: Missing, malformed, expired or invalid Firebase ID token. No verification details disclosed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing:
              value: { error: { code: UNAUTHENTICATED, message: A valid bearer token is required } }
            invalidOrExpired:
              value: { error: { code: UNAUTHENTICATED, message: A valid bearer token is required } }
    InvalidInput:
      description: Field or identifier validation failure, or existing malformed JSON error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidInput:
              value: { error: { code: INVALID_INPUT, message: Request fields are invalid } }
            invalidJson:
              value: { error: { code: INVALID_JSON, message: Request body must be valid JSON } }
    ServiceUnavailable:
      description: Transient conflict while creating or updating; retry after a moment.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            conflict:
              value: { error: { code: SERVICE_UNAVAILABLE, message: Please try again in a moment. } }
    UnprocessableAge:
      description: >-
        Birth month is in the future or implies an age over 71 months, or (POST
        only) the caregiver already has 20 children.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            outOfRange:
              value:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: Child age must be between 0 and 71 months
                  details: [{ field: birthMonthYear, issue: Must not be in the future or older than 71 months }]
            limitReached:
              value:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: You can add up to 20 children.
                  details: [{ field: children, issue: Limit of 20 children reached }]
    UnprocessableObservationDate:
      description: Observation date is more than one day ahead of today in UTC (in the future even in UTC+14).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            futureDate:
              value:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: Observation date cannot be in the future
                  details: [{ field: observedDate, issue: Must not be in the future }]
    ChildNotFound:
      description: Child missing from the caller's scope or not owned by the caller; identical response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingOrNotOwned:
              value: { error: { code: RESOURCE_NOT_FOUND, message: Resource not found } }
    PayloadTooLarge:
      description: Request body is larger than the 100 KB limit (RFC 9110 section 15.5.14). Any endpoint that reads a JSON body may return this.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            tooLarge:
              value: { error: { code: PAYLOAD_TOO_LARGE, message: The request body is too large. } }
    InternalError:
      description: Unexpected server error. No internal detail disclosed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value: { error: { code: INTERNAL_ERROR, message: An unexpected error occurred } }
    RateLimited:
      x-implementation-status: partial
      description: >-
        Too many requests from this IP address or caller UID. Implemented on
        POST /api/v1/ai/recommendations and POST /api/v1/ai/story-activity; other endpoints are not rate limited yet.
        Wait Retry-After seconds (the real time until the hourly window resets) before retrying.
      headers:
        Retry-After:
          description: Delay in seconds before retrying (RFC 6585 section 4, RFC 9110 section 10.2.3).
          schema:
            type: string
            pattern: '^[0-9]+$'
            example: '30'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rateLimited:
              value: { error: { code: RATE_LIMITED, message: You have reached the hourly limit for suggestions. Please try again later. } }
  headers:
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110 section 10.2.3).
      schema:
        type: integer
        minimum: 0
        example: 1
    CacheControlNoStore:
      description: >-
        Always no-store on errors (RFC 9111 section 5.2.2.5). RFC 9110 section
        15.1 lists 404 as heuristically cacheable, so error responses must send
        no-store explicitly.
      schema:
        type: string
        enum: [no-store]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
