openapi: 3.1.0
info:
  title: LittleSteps API
  version: 0.2.0
  description: >-
    Health, identity, learning-catalog and AI recommendation endpoints are implemented. Child-profile
    operations are a reviewable design contract for Issue 7, not implemented routes.
    Open decisions D5 (deletion execution) and D6 (production retention) in
    docs/child-profile-contract.md block only the deletion API and production
    deployment, not Issue 8.
servers:
  - url: http://127.0.0.1:5001/{projectId}/asia-southeast1/api
    description: Firebase Functions emulator; replace projectId with the local Firebase project ID.
    variables:
      projectId:
        default: demo-littlesteps
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness
      security: []
      responses:
        '200':
          description: API is responding
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated Firebase UID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified user identity
          content:
            application/json:
              schema:
                type: object
                required: [uid]
                properties:
                  uid:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/catalog/activities:
    get:
      operationId: listCatalogActivities
      summary: List and filter learning catalog activities, stories, rhymes, and games
      description: |
        Public read endpoint for age-aware catalog browsing (FR-04).
        Returns activities filtered by age band, type, domain, language, or setting.
        Unreviewed or synthetic engineering fixtures are explicitly labeled and cannot be presented as approved.
      security: []
      parameters:
        - name: ageBand
          in: query
          required: false
          description: Developmental age band
          schema:
            $ref: '#/components/schemas/AgeBand'
        - name: type
          in: query
          required: false
          description: Catalog resource type
          schema:
            $ref: '#/components/schemas/ActivityType'
        - name: domain
          in: query
          required: false
          description: Early childhood developmental domain
          schema:
            $ref: '#/components/schemas/Domain'
        - name: language
          in: query
          required: false
          description: Language of the activity
          schema:
            $ref: '#/components/schemas/Language'
        - name: setting
          in: query
          required: false
          description: Recommended setting
          schema:
            $ref: '#/components/schemas/Setting'
        - name: limit
          in: query
          required: false
          description: Maximum items to return (default 20, max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Filtered catalog items
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogActivity'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/catalog/activities/{id}:
    get:
      operationId: getCatalogActivityById
      summary: Retrieve a single catalog activity by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Canonical activity ID
          schema:
            type: string
            maxLength: 64
            pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: Catalog item found
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogActivity'
        '400':
          description: Invalid activity id format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Item not found in catalog (code RESOURCE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/catalog/books:
    get:
      operationId: listCatalogBooks
      summary: Query picture books catalog from Open Library with caching and fallback
      description: |
        Proxy to Open Library REST API with server-side 1-hour in-memory cache and offline fallback (api-reference.md §5.1, ADR-010).
      security: []
      parameters:
        - name: subject
          in: query
          required: false
          description: Book subject (allowlist)
          schema:
            type: string
            maxLength: 64
            enum: [picture_books, bedtime, colors, animals]
            default: picture_books
        - name: limit
          in: query
          required: false
          description: Maximum books to return (default 12, max 30)
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 12
      responses:
        '200':
          description: Picture book list with provenance. Fallback responses use max-age=60.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
            X-Cache:
              description: >-
                Whether the response was served from the server-side cache.
                Documented non-standard debug header. RFC 6648 advises against
                new X- headers; Cache-Status (RFC 9211) is an alternative, not reviewed.
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ai/recommendations:
    post:
      operationId: createAiRecommendations
      summary: Suggest reviewed catalog activities for an age band
      description: |
        Constrained activity suggestions (api-reference.md section 6). Only reviewed_approved catalog
        items are ever returned; titles and instructions always come from the catalog. The request
        carries no child or caregiver identifiers and unknown fields are rejected. A provider failure
        or invalid provider output is never an error: the response falls back to deterministic
        catalog ranking (tier 3). With no reviewed content the response is 200 with an empty list.
        Responses are never cached.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Suggestions with provenance
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          # Not implemented yet: rate limiting is a later change.
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/children:
    post:
      operationId: createChild
      summary: Create an owned child profile (design only)
      description: >-
        Proposed operation, not implemented. The server assigns a UUIDv4,
        caregiverId from the verified token UID, and UTC timestamps. No
        client-supplied identity establishes ownership. When birthMonthYear is
        given, the server derives the band from its UTC calendar month. A future
        month, or one more than 71 months ago, returns 422 UNPROCESSABLE_ENTITY. Months are counted in UTC as (current year x 12 + current month) - (birth year x 12 + birth month); 0 to 71 inclusive is accepted.
      x-implementation-status: not-implemented
      x-contract-status: proposed-pending-review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChild'
            examples:
              birthMonth:
                value: { nickname: Sample Child, birthMonthYear: '2025-08' }
              bandOnly:
                value: { nickname: Sample Child, ageBand: 12-23m }
      responses:
        '201':
          description: Proposed created profile; contains no internal caregiver UID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
              examples:
                created:
                  $ref: '#/components/examples/Child'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnprocessableAge'
    get:
      operationId: listChildren
      summary: List owned child profiles (design only)
      description: >-
        Proposed unpaginated JSON array for the first slice, not implemented.
        Query only the verified UID's caregiver path; never list globally and
        filter in the client. An account without children receives an empty array.
        Pagination and ordering are not promised by this draft.
      x-implementation-status: not-implemented
      x-contract-status: proposed-pending-review
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned profiles only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildProfile'
              examples:
                empty:
                  value: []
                owned:
                  value:
                    - id: 6f1c344e-84a8-4e24-9d72-74739a8c1362
                      nickname: Sample Child
                      birthMonthYear: '2025-08'
                      ageBand: 12-23m
                      createdAt: '2026-10-29T08:00:00Z'
                      updatedAt: '2026-10-29T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        description: Server-generated child UUIDv4; never evidence of ownership.
        schema:
          $ref: '#/components/schemas/ChildId'
    get:
      operationId: getChild
      summary: Read an owned child profile (design only)
      description: >-
        Not implemented. Resolve the ID within the verified UID's child path,
        verify caregiverId matches that UID, and expose no profile until authorized.
        Cross-owner substitution and nonexistent IDs have identical 404 responses.
      x-implementation-status: not-implemented
      x-contract-status: proposed-pending-review
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OwnedChild'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
    patch:
      operationId: updateChild
      summary: Update an owned child profile (design only)
      description: >-
        Proposed partial update, not implemented. Send nickname and/or exactly
        one age source (birthMonthYear or ageBand), validated as on create, so
        caregivers can correct age (right to rectification). Supplying an age
        source replaces the previous one: birthMonthYear stores the month and the
        band is derived on read; ageBand removes any stored birth month. A future
        or over-71-month birth month returns 422. Ownership, identifiers and
        timestamps cannot be supplied or reassigned by the client.

        The body is a plain application/json partial update, not JSON Merge
        Patch (RFC 7396 gives null the meaning remove). Nulls are rejected with 400.
      x-implementation-status: not-implemented
      x-contract-status: proposed-pending-review
      security:
        - bearerAuth: []
      requestBody:
        description: >-
          Content type application/json (not application/merge-patch+json).
          Partial update of the listed fields; null values are rejected with 400.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChild'
            examples:
              rename:
                value: { nickname: Sample Sprout }
              correctBirthMonth:
                value: { birthMonthYear: '2025-07' }
      responses:
        '200':
          description: Proposed updated profile with server-assigned updatedAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
              examples:
                updated:
                  value:
                    id: 6f1c344e-84a8-4e24-9d72-74739a8c1362
                    nickname: Sample Sprout
                    birthMonthYear: '2025-08'
                    ageBand: 12-23m
                    createdAt: '2026-10-29T08:00:00Z'
                    updatedAt: '2026-10-29T08:05:00Z'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableAge'
components:
  schemas:
    ChildId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Nickname:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '\S'
      description: >-
        Nickname only. The server trims leading and trailing whitespace and
        collapses internal whitespace runs to one space (decision D4), then
        rejects an empty result; whitespace-only values are invalid.
    BirthMonthYear:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      description: >-
        Coarse YYYY-MM, never an exact date. An ISO 8601 reduced-precision
        calendar month, not an RFC 3339 full-date or date-time (RFC 3339
        section 5.6 full-date needs year-month-day). The pattern checks shape
        only; the 422 range check is server logic. Age in months is computed against
        the server's UTC calendar month. A future month or an age over 71
        months is rejected with 422 UNPROCESSABLE_ENTITY (shape errors are 400).
    AgeBand:
      type: string
      enum: [0-5m, 6-11m, 12-23m, 24-35m, 36-47m, 48-59m, 60-71m]
      description: Navigation categories, not clinical classifications.
    CreateChild:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          $ref: '#/components/schemas/Nickname'
        birthMonthYear:
          $ref: '#/components/schemas/BirthMonthYear'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
      oneOf:
        - required: [birthMonthYear]
        - required: [ageBand]
      description: >-
        Exactly one age source. When birthMonthYear is given, the server derives
        ageBand. Otherwise the caregiver selects a band. No implicit defaults
        or null values.
    UpdateChild:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname:
          $ref: '#/components/schemas/Nickname'
        birthMonthYear:
          $ref: '#/components/schemas/BirthMonthYear'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
      not:
        required: [birthMonthYear, ageBand]
      description: >-
        At least one field; at most one of birthMonthYear and ageBand. Same
        validation as create. No nulls.
    ChildProfile:
      type: object
      additionalProperties: false
      required: [id, nickname, ageBand, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ChildId'
        nickname:
          $ref: '#/components/schemas/Nickname'
        birthMonthYear:
          $ref: '#/components/schemas/BirthMonthYear'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: >-
        Proposed public projection; caregiverId is internal. Optional birth month
        is omitted when not supplied. No nulls or implicit defaults. UTC timestamps
        are serialized from internal Firestore timestamps. When birthMonthYear is
        present, ageBand is derived on read from the UTC calendar month; a child
        past 71 months stays at 60-71m (conservative; no new field, never
        rejected on read). A caregiver-selected band is returned as stored.
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [ageBand, timeMinutes, language]
      properties:
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        domain:
          $ref: '#/components/schemas/Domain'
        setting:
          allOf:
            - $ref: '#/components/schemas/Setting'
          default: either
        timeMinutes:
          type: integer
          minimum: 5
          maximum: 120
        materials:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        language:
          $ref: '#/components/schemas/Language'
        count:
          type: integer
          minimum: 1
          maximum: 3
          default: 3
    RecommendationResponse:
      type: object
      required: [suggestions, source, tier, provenance]
      properties:
        suggestions:
          type: array
          maxItems: 3
          items:
            type: object
            required: [activityId, title, whyPicked, activity]
            properties:
              activityId:
                type: string
              title:
                type: string
              whyPicked:
                type: string
                maxLength: 140
              activity:
                $ref: '#/components/schemas/CatalogActivity'
        source:
          type: string
          enum: [ai, catalog_fallback]
        tier:
          type: integer
          enum: [1, 2, 3]
        provenance:
          type: object
          required: [badge, label, disclaimer, model, reviewed]
          properties:
            badge:
              type: [string, 'null']
              enum: [Suggested by AI, null]
            label:
              type: [string, 'null']
              enum: [Our picks, null]
            disclaimer:
              type: string
            guidance:
              type: string
              description: Present only when source is ai.
            model:
              type: [string, 'null']
            reviewed:
              type: boolean
              const: true
        reason:
          type: string
          enum: [NO_REVIEWED_CONTENT]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field:
                    type: string
                  issue:
                    type: string
      description: Existing safe error envelope; never includes resource metadata or token details.
    ActivityType:
      type: string
      enum:
        - activity
        - story
        - rhyme
        - game

    Domain:
      type: string
      enum:
        - cognitive
        - motor
        - language
        - socioEmotional

    Language:
      type: string
      enum:
        - en
        - fil
        - hil

    Setting:
      type: string
      enum:
        - indoor
        - outdoor
        - either

    ReviewStatus:
      type: string
      enum:
        - reviewed_approved
        - synthetic_fixture
        - draft

    CatalogActivity:
      type: object
      required:
        - id
        - title
        - type
        - language
        - setting
        - ageBand
        - domain
        - durationMinutes
        - durationEstimate
        - materials
        - instructions
        - provenanceSource
        - status
        - limitations
      properties:
        id:
          type: string
          example: act-ph-bahay-bahayan-01
        title:
          type: string
          maxLength: 100
          example: Bahay-Bahayan Pretend Play
        type:
          $ref: '#/components/schemas/ActivityType'
        language:
          $ref: '#/components/schemas/Language'
        setting:
          $ref: '#/components/schemas/Setting'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        domain:
          $ref: '#/components/schemas/Domain'
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
          example: 15
        durationEstimate:
          type: string
          example: 10-15 mins
        materials:
          type: array
          items:
            type: string
          example: ["blanket", "cushions"]
        instructions:
          type: array
          items:
            type: string
          example:
            - Set up cushions or chairs to form walls.
            - Drape a light blanket to create a roof.
            - Encourage child to act out everyday household routines.
        provenanceSource:
          type: string
          example: Synthetic engineering fixture; no external source
        status:
          $ref: '#/components/schemas/ReviewStatus'
        limitations:
          type: string
          example: Provisional Academic Reference — Pending Review. Educational prompt only; not a diagnostic assessment.

    BookItem:
      type: object
      required:
        - id
        - title
        - authors
        - coverUrl
        - subjects
      properties:
        id:
          type: string
          example: OL52987W
        title:
          type: string
          example: The Very Hungry Caterpillar
        authors:
          type: array
          items:
            type: string
          example: ["Eric Carle"]
        coverUrl:
          type: [string, "null"]
          example: https://covers.openlibrary.org/b/id/7835968-M.jpg
        subjects:
          type: array
          items:
            type: string
          example: ["Caterpillars", "Metamorphosis", "Picture books"]

    BooksResponse:
      type: object
      required:
        - subject
        - totalCount
        - books
        - provenance
      properties:
        subject:
          type: string
          example: picture_books
        totalCount:
          type: integer
          example: 12
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookItem'
        provenance:
          type: object
          required:
            - source
          properties:
            source:
              type: string
              example: Open Library (Internet Archive)
            license:
              type: string
              example: "Open Library data; no new rights asserted by the Internet Archive (see https://openlibrary.org/developers/licensing); some contributions may carry existing rights"
  examples:
    Child:
      summary: Synthetic profile; age shown as of October 2026.
      value:
        id: 6f1c344e-84a8-4e24-9d72-74739a8c1362
        nickname: Sample Child
        birthMonthYear: '2025-08'
        ageBand: 12-23m
        createdAt: '2026-10-29T08:00:00Z'
        updatedAt: '2026-10-29T08:00:00Z'
  responses:
    OwnedChild:
      description: Proposed public projection of an owned child.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChildProfile'
          examples:
            owned:
              $ref: '#/components/examples/Child'
    Unauthenticated:
      description: Missing, malformed, expired or invalid Firebase ID token. No verification details disclosed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing:
              value: { error: { code: UNAUTHENTICATED, message: A valid bearer token is required } }
            invalidOrExpired:
              value: { error: { code: UNAUTHENTICATED, message: A valid bearer token is required } }
    InvalidInput:
      description: Proposed field or identifier validation failure, or existing malformed JSON error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidInput:
              value: { error: { code: INVALID_INPUT, message: Request fields are invalid } }
            invalidJson:
              value: { error: { code: INVALID_JSON, message: Request body must be valid JSON } }
    UnprocessableAge:
      description: Birth month is in the future or implies an age over 71 months.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            outOfRange:
              value:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: Child age must be between 0 and 71 months
                  details: [{ field: birthMonthYear, issue: Must not be in the future or older than 71 months }]
    ChildNotFound:
      description: Child missing from the caller's scope or not owned by the caller; identical response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingOrNotOwned:
              value: { error: { code: RESOURCE_NOT_FOUND, message: Resource not found } }
    InternalError:
      description: Unexpected server error. No internal detail disclosed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value: { error: { code: INTERNAL_ERROR, message: An unexpected error occurred } }
    RateLimited:
      x-implementation-status: not-implemented
      description: >-
        Too many requests from this IP address or caller UID. Any endpoint may
        return this. Wait Retry-After seconds before retrying. Proposed; rate
        limiting is not implemented yet.
      headers:
        Retry-After:
          description: Delay in seconds before retrying (RFC 6585 section 4, RFC 9110 section 10.2.3).
          schema:
            type: string
            pattern: '^[0-9]+$'
            example: '30'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rateLimited:
              value: { error: { code: RATE_LIMITED, message: Too many requests } }
  headers:
    CacheControlNoStore:
      description: >-
        Always no-store on errors (RFC 9111 section 5.2.2.5). RFC 9110 section
        15.1 lists 404 as heuristically cacheable, so error responses must send
        no-store explicitly.
      schema:
        type: string
        enum: [no-store]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
