openapi: 3.1.0
info:
  title: LittleSteps API
  version: 0.1.0
  description: Initial contract scaffold. Feature endpoints are intentionally not yet specified.
servers:
  - url: http://127.0.0.1:5001/{projectId}/asia-southeast1/api
    description: Firebase Functions emulator; replace projectId with the local Firebase project ID.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness
      security: []
      responses:
        '200':
          description: API is responding
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated Firebase UID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified user identity
          content:
            application/json:
              schema:
                type: object
                required: [uid]
                properties:
                  uid:
                    type: string
        '401':
          description: Missing or invalid Firebase ID token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
