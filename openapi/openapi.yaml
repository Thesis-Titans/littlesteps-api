openapi: 3.1.0
info:
  title: LittleSteps API
  version: 0.3.0
  description: >-
    Health, identity, account data export and account deletion, learning-catalog, child-profile (create, list, read, update, delete),
    activity planning and completion, milestone observation records, and
    AI recommendations endpoints are implemented. The recommendations endpoint calls Gemini
    only when the GEMINI_API_KEY and GEMINI_MODEL server variables are both set; without
    them, or on any provider failure, it returns the deterministic catalog fallback. Rate
    limiting is implemented on the AI recommendations endpoint only. Decisions D5 (deletion execution) and D6 (production retention) in docs/child-profile-contract.md were decided on 4 November 2026; child and account deletion and JSON data export are implemented (Issue 17).




servers:
  - url: http://127.0.0.1:5001/{projectId}/asia-southeast1/api
    description: Firebase Functions emulator; replace projectId with the local Firebase project ID.
    variables:
      projectId:
        default: demo-littlesteps
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness
      security: []
      responses:
        '200':
          description: API is responding
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated Firebase UID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified user identity
          content:
            application/json:
              schema:
                type: object
                required: [uid]
                properties:
                  uid:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      operationId: deleteAccount
      summary: Permanently delete the signed-in caregiver's account and all records
      description: >-
        Hard cascade deletion for the verified caregiver (RA 10173 right to erasure,
        decision D5). Deletes every owned child with all child-scoped subcollections
        (plans, milestone observations, journal entries, weekly summaries) child by
        child, then deletes the caregiver profile document, and finally removes the
        Firebase Authentication user last. Every step is repeatable so a failed request
        returns 500 and the client may retry. Only the deletion event and caregiver UID
        are logged; no record content is written to logs.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account and all associated records permanently deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/export:
    get:
      operationId: exportAccountData
      summary: Download all records for the signed-in caregiver and their children as JSON
      description: >-
        Structured JSON data portability export (RA 10173 section 18) for the verified
        caregiver only. Returns the caregiver profile, owned child profiles, activity
        plans, milestone observations, and private journal entries, projected without
        internal caregiverId fields. Any attempt to target another caregiver returns
        404 RESOURCE_NOT_FOUND. Nothing exported is written to logs.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Complete JSON export of the signed-in caregiver's records.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/catalog/activities:
    get:
      operationId: listCatalogActivities
      summary: List and filter learning catalog activities, stories, rhymes, and games
      description: |
        Public read endpoint for age-aware catalog browsing (FR-04).
        Returns activities filtered by age band, type, domain, language, or setting.
        Unreviewed or synthetic engineering fixtures are explicitly labeled and cannot be presented as approved.
      security: []
      parameters:
        - name: ageBand
          in: query
          required: false
          description: Developmental age band
          schema:
            $ref: '#/components/schemas/AgeBand'
        - name: type
          in: query
          required: false
          description: Catalog resource type
          schema:
            $ref: '#/components/schemas/ActivityType'
        - name: domain
          in: query
          required: false
          description: Early childhood developmental domain
          schema:
            $ref: '#/components/schemas/Domain'
        - name: language
          in: query
          required: false
          description: Language of the activity
          schema:
            $ref: '#/components/schemas/Language'
        - name: setting
          in: query
          required: false
          description: Recommended setting
          schema:
            $ref: '#/components/schemas/Setting'
        - name: limit
          in: query
          required: false
          description: Maximum items to return (default 20, max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Filtered catalog items
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogActivity'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/catalog/activities/{id}:
    get:
      operationId: getCatalogActivityById
      summary: Retrieve a single catalog activity by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Canonical activity ID
          schema:
            type: string
            maxLength: 64
            pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: Catalog item found
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogActivity'
        '400':
          description: Invalid activity id format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Item not found in catalog (code RESOURCE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/catalog/books:
    get:
      operationId: listCatalogBooks
      summary: Query picture books catalog from Open Library with caching and fallback
      description: |
        Proxy to Open Library REST API with server-side 1-hour in-memory cache and offline fallback (api-reference.md §5.1, ADR-010).
      security: []
      parameters:
        - name: subject
          in: query
          required: false
          description: Book subject (allowlist)
          schema:
            type: string
            maxLength: 64
            enum: [picture_books, bedtime, colors, animals]
            default: picture_books
        - name: limit
          in: query
          required: false
          description: Maximum books to return (default 12, max 30)
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 12
      responses:
        '200':
          description: Picture book list with provenance. Fallback responses use max-age=60.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
            X-Cache:
              description: >-
                Whether the response was served from the server-side cache.
                Documented non-standard debug header. RFC 6648 advises against
                new X- headers; Cache-Status (RFC 9211) is an alternative, not reviewed.
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalog/weather:
    get:
      operationId: getWeatherHint
      summary: Coarse weather hint for indoor/outdoor activity setting
      description: |
        Weather hint (ADR-009, FR-02/FR-06) powered by Open-Meteo. Calls Open-Meteo with fixed,
        rounded coordinates (defaulting to Iloilo City: 10.72, 122.56). Never transmits device GPS,
        caregiver, or child data. Responses are cached for 1 hour. On timeout (>3s) or upstream
        failure, returns a neutral fallback (condition: unavailable, setting: either, hint: null).
      x-implementation-status: implemented
      parameters:
        - name: latitude
          in: query
          required: false
          description: Latitude rounded to 2 decimal places (-90 to 90, default 10.72 for Iloilo City)
          schema:
            type: number
            minimum: -90
            maximum: 90
            default: 10.72
        - name: longitude
          in: query
          required: false
          description: Longitude rounded to 2 decimal places (-180 to 180, default 122.56 for Iloilo City)
          schema:
            type: number
            minimum: -180
            maximum: 180
            default: 122.56
      responses:
        '200':
          description: Weather hint with Open-Meteo provenance
          headers:
            Cache-Control:
              description: Cache directive (public 1 hour for fresh forecast, 60s for fallback)
              schema:
                type: string
            X-Cache:
              description: Whether the response was served from in-memory cache
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
        '400':
          description: Invalid coordinates query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ai/recommendations:
    post:
      operationId: createAiRecommendations
      summary: Suggest reviewed catalog activities for an age band
      description: |
        Constrained activity suggestions (api-reference.md section 6). Only reviewed_approved catalog
        items are ever returned; titles and instructions always come from the catalog. The request
        carries no child or caregiver identifiers and unknown fields are rejected. A provider failure
        or invalid provider output is never an error: the response falls back to deterministic
        catalog ranking (tier 3). With no reviewed content the response is 200 with an empty list.
        Responses are never cached.

        Rate limit: 10 requests per signed-in user and, by default, 30 per IP address (configurable; 0 disables
        the per-IP cap) in each clock hour
        (fixed window, UTC). Every authenticated request counts, including ones rejected as
        invalid. Over the limit the response is 429 with Retry-After set to the seconds left in
        the window. If the limit store is unavailable the request is allowed.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Suggestions with provenance
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ai/story-activity:
    post:
      operationId: createStoryActivity
      summary: Suggest a companion play idea for a storybook
      description: |
        Storybook companion suggestion (api-reference.md section 6). From a book title,
        subject tags and the child's age band, returns one short play idea with domain,
        instructions and safety notice. The request carries no child or caregiver identifiers
        and unknown fields are rejected. A provider failure, timeout, or invalid output falls
        back to a deterministic catalog activity match (tier 3). Responses are never cached.

        Protected by Firebase authentication and the same hourly AI rate limits as recommendations.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryActivityRequest'
      responses:
        '200':
          description: Companion play idea with provenance
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryActivityResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/children:
    post:
      operationId: createChild
      summary: Create an owned child profile
      description: >-
        The server assigns a UUIDv4,
        caregiverId from the verified token UID, and UTC timestamps. No
        client-supplied identity establishes ownership. When birthMonthYear is
        given, the server derives the band from its UTC calendar month. A future
        month, or one more than 71 months ago, returns 422 UNPROCESSABLE_ENTITY. Months are counted in UTC as (current year x 12 + current month) - (birth year x 12 + birth month); 0 to 71 inclusive is accepted.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChild'
            examples:
              birthMonth:
                value: { nickname: Sample Child, birthMonthYear: '2025-08' }
              bandOnly:
                value: { nickname: Sample Child, ageBand: 12-23m }
      responses:
        '201':
          description: Created profile; contains no internal caregiver UID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
              examples:
                created:
                  $ref: '#/components/examples/Child'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnprocessableAge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/children/{childId}/summary/weekly:
    parameters:
      - name: childId
        in: path
        required: true
        description: Server-generated child UUIDv4.
        schema:
          $ref: '#/components/schemas/ChildId'
    get:
      operationId: getWeeklySummary
      summary: Retrieve factual weekly progress summary for an owned child
      description: >-
        Returns a deterministic, non-diagnostic reflection summary aggregating completed
        activities and recorded milestone observations over a 7-day ISO calendar week.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: week
          in: query
          required: false
          description: ISO 8601 week formatted as YYYY-Www (e.g. 2026-W45). Defaults to current week.
          schema:
            type: string
            pattern: '^\d{4}-W(?:0[1-9]|[1-4]\d|5[0-3])$'
            example: '2026-W45'
      responses:
        '200':
          description: Factual weekly reflection summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySummary'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
    get:
      operationId: listChildren
      summary: List owned child profiles
      description: >-
        Unpaginated JSON array ordered by createdAt, then id.
        Query only the verified UID's caregiver path; never list globally and
        filter in the client. An account without children receives an empty array.
        Pagination is not provided. A caregiver can have at most 20 children;
        the list bound of 50 is only a safety limit.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned profiles only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildProfile'
              examples:
                empty:
                  value: []
                owned:
                  value:
                    - id: 6f1c344e-84a8-4e24-9d72-74739a8c1362
                      nickname: Sample Child
                      birthMonthYear: '2025-08'
                      ageBand: 12-23m
                      createdAt: '2026-10-29T08:00:00Z'
                      updatedAt: '2026-10-29T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        description: Server-generated child UUIDv4; never evidence of ownership.
        schema:
          $ref: '#/components/schemas/ChildId'
    get:
      operationId: getChild
      summary: Read an owned child profile
      description: >-
        Resolve the ID within the verified UID's child path,
        verify caregiverId matches that UID, and expose no profile until authorized.
        Cross-owner substitution, nonexistent IDs and malformed IDs have identical 404 responses.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OwnedChild'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
    patch:
      operationId: updateChild
      summary: Update an owned child profile
      description: >-
        Partial update. Send nickname and/or exactly
        one age source (birthMonthYear or ageBand), validated as on create, so
        caregivers can correct age (right to rectification). Supplying an age
        source replaces the previous one: birthMonthYear stores the month and the
        band is derived on read; ageBand removes any stored birth month. A future
        or over-71-month birth month returns 422. Ownership, identifiers and
        timestamps cannot be supplied or reassigned by the client.

        The body is a plain application/json partial update, not JSON Merge
        Patch (RFC 7396 gives null the meaning remove). Nulls are rejected with 400.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        description: >-
          Content type application/json (not application/merge-patch+json).
          Partial update of the listed fields; null values are rejected with 400.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChild'
            examples:
              rename:
                value: { nickname: Sample Sprout }
              correctBirthMonth:
                value: { birthMonthYear: '2025-07' }
      responses:
        '200':
          description: Updated profile with server-assigned updatedAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
              examples:
                updated:
                  value:
                    id: 6f1c344e-84a8-4e24-9d72-74739a8c1362
                    nickname: Sample Sprout
                    birthMonthYear: '2025-08'
                    ageBand: 12-23m
                    createdAt: '2026-10-29T08:00:00Z'
                    updatedAt: '2026-10-29T08:05:00Z'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableAge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      operationId: deleteChild
      summary: Permanently delete an owned child profile and all child-scoped records
      description: >-
        Hard cascade deletion of an owned child and all subcollections (plans,
        milestone observations, journal entries, weekly summaries) via recursive
        delete inside the request (decision D5). Missing, malformed, or cross-owner
        child IDs return the identical 404 RESOURCE_NOT_FOUND response. Only the
        deletion event and child ID are logged; no profile or observation content
        is written to logs.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Child profile and all child-scoped records permanently deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/children/{childId}/summary/weekly:
    parameters:
      - name: childId
        in: path
        required: true
        description: Server-generated child UUIDv4.
        schema:
          $ref: '#/components/schemas/ChildId'
    get:
      operationId: getWeeklySummary
      summary: Retrieve factual weekly progress summary for an owned child
      description: >-
        Returns a deterministic, non-diagnostic reflection summary aggregating completed
        activities and recorded milestone observations over a 7-day ISO calendar week.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: week
          in: query
          required: false
          description: ISO 8601 week formatted as YYYY-Www (e.g. 2026-W45). Defaults to current week.
          schema:
            type: string
            pattern: '^\d{4}-W(?:0[1-9]|[1-4]\d|5[0-3])$'
            example: '2026-W45'
      responses:
        '200':
          description: Factual weekly reflection summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySummary'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'

  /api/v1/children/{childId}/plans:
    parameters:
      - name: childId
        in: path
        required: true
        description: Server-generated child UUIDv4; never evidence of ownership.
        schema:
          $ref: '#/components/schemas/ChildId'
    get:
      operationId: listChildPlans
      summary: List activity plans for an owned child
      description: >-
        Returns activity plans for the verified caregiver's child, optionally
        filtered by target date or status. Ordered by scheduled date and document id.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: Target scheduled date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        - name: status
          in: query
          required: false
          description: Filter by routine planning status
          schema:
            $ref: '#/components/schemas/PlanStatus'
      responses:
        '200':
          description: Array of planned activities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
    post:
      operationId: createChildPlan
      summary: Schedule or plan an activity for an owned child
      description: >-
        Schedules an activity for the child on a given date. Status defaults to
        planned. When status is set to completed, completedAt is automatically recorded.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlan'
      responses:
        '201':
          description: Created activity plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ChildNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/children/{childId}/summary/weekly:
    parameters:
      - name: childId
        in: path
        required: true
        description: Server-generated child UUIDv4.
        schema:
          $ref: '#/components/schemas/ChildId'
    get:
      operationId: getWeeklySummary
      summary: Retrieve factual weekly progress summary for an owned child
      description: >-
        Returns a deterministic, non-diagnostic reflection summary aggregating completed
        activities and recorded milestone observations over a 7-day ISO calendar week.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: week
          in: query
          required: false
          description: ISO 8601 week formatted as YYYY-Www (e.g. 2026-W45). Defaults to current week.
          schema:
            type: string
            pattern: '^\d{4}-W(?:0[1-9]|[1-4]\d|5[0-3])$'
            example: '2026-W45'
      responses:
        '200':
          description: Factual weekly reflection summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySummary'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
