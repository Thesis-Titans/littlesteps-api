name: Secret Scan

# Scans every push and PR for leaked credentials: .env values, Firebase service account
# keys, API tokens, and private keys. Blocks merges if secrets are detected.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for commit scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

